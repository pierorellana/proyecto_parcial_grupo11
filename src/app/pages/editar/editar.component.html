<div class="editar-container">
    <h2>Editar Solicitud</h2>
    <form (ngSubmit)="saveChanges()">
      <div class="form-group">
        <label for="nombreCliente">Nombre del Cliente:</label>
        <input type="text" id="nombreCliente" [(ngModel)]="solicitud.nombreCliente" name="nombreCliente" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="correoCliente">Correo del Cliente:</label>
        <input type="email" id="correoCliente" [(ngModel)]="solicitud.correoCliente" name="correoCliente" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="telefonoCliente">Teléfono del Cliente:</label>
        <input type="text" id="telefonoCliente" [(ngModel)]="solicitud.telefonoCliente" name="telefonoCliente" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" [(ngModel)]="solicitud.ciudad" name="ciudad" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="estadoProvincia">Estado/Provincia:</label>
        <input type="text" id="estadoProvincia" [(ngModel)]="solicitud.estadoProvincia" name="estadoProvincia" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="direccionCalle1">Dirección Calle 1:</label>
        <input type="text" id="direccionCalle1" [(ngModel)]="solicitud.direccionCalle1" name="direccionCalle1" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="codigoPostal">Código Postal:</label>
        <input type="text" id="codigoPostal" [(ngModel)]="solicitud.codigoPostal" name="codigoPostal" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="referencia">Referencia:</label>
        <input type="text" id="referencia" [(ngModel)]="solicitud.referencia" name="referencia" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="metodoPago">Método de Pago:</label>
        <select id="metodoPago" [(ngModel)]="solicitud.metodoPago" name="metodoPago" class="form-control">
          <option value="paypal">PayPal</option>
          <option value="tarjeta">Tarjeta de Crédito</option>
        </select>
      </div>
  
      <div *ngIf="solicitud.metodoPago === 'paypal'" class="form-group">
        <label for="correoPaypal">Correo PayPal:</label>
        <input type="email" id="correoPaypal" [(ngModel)]="solicitud.correoPaypal" name="correoPaypal" class="form-control">
      </div>
  
      <div *ngIf="solicitud.metodoPago === 'tarjeta'">
        <div class="form-group">
          <label for="nombreTarjeta">Nombre en la Tarjeta:</label>
          <input type="text" id="nombreTarjeta" [(ngModel)]="solicitud.nombreTarjeta" name="nombreTarjeta" class="form-control">
        </div>
        <div class="form-group">
          <label for="numeroTarjeta">Número de la Tarjeta:</label>
          <input type="text" id="numeroTarjeta" [(ngModel)]="solicitud.numeroTarjeta" name="numeroTarjeta" class="form-control">
        </div>
        <div class="form-group">
          <label for="expiracionTarjeta">Expiración de la Tarjeta:</label>
          <input type="text" id="expiracionTarjeta" [(ngModel)]="solicitud.expiracionTarjeta" name="expiracionTarjeta" class="form-control">
        </div>
        <div class="form-group">
          <label for="cvcTarjeta">CVC de la Tarjeta:</label>
          <input type="text" id="cvcTarjeta" [(ngModel)]="solicitud.cvcTarjeta" name="cvcTarjeta" class="form-control">
        </div>
      </div>
  
      <div class="form-group">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" [(ngModel)]="solicitud.cantidad" name="cantidad" class="form-control">
      </div>
  
      <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    </form>
  </div>
